<body>
<header>
    <nav aria-label="Main navigation">
        <div>
            <a href="index.html" aria-label="Khency's Beauty & Wellness Spa home">
                <picture>
                    <source media="(max-width: 480px)" srcset="images/kbs-80w.jpeg">
                    <img src="images/kbs-160w.jpeg" srcset="images/kbs-80w.jpeg 80w, images/kbs-160w.jpeg 160w, images/kbs-225w.jpeg 225w" sizes="64px" alt="Khency's Beauty & Wellness Spa logo">

            </ul>

</header>

<main>
    <header class="page-header">
        <p class="eyebrow">We would love to hear from you</p>
        <h1>Make an Enquiry</h1>
        <p class="lead">Complete the form below and we will get back to you.</p>
    </header>
    <section class="form-card">
        <form id="enquiry-form" action="#" method="post">
            <div class="form-group"><label for="name">Full Name</label><input type="text" id="name" name="name" autocomplete="name" required></div>
            <div class="form-group"><label for="email">Email Address</label><input type="email" id="email" name="email" autocomplete="email" required></div>
            <div class="form-group"><label for="phone">Phone Number</label><input type="tel" id="phone" name="phone" autocomplete="tel"></div>
            <div class="form-group"><label for="service">Select a Service</label><select id="service" name="service" required><option value="">Please select</option><option value="facial">Facial Treatment</option><option value="massage">Massage Therapy</option><option value="manicure">Manicure</option><option value="waxing">Waxing</option><option value="cupping">Cupping Therapy</option></select></div>
            <div class="form-group"><label for="message">Your Enquiry</label><textarea id="message" name="message" required></textarea></div>
            <button class="button" type="submit">Submit Enquiry</button>
        </form>
    </section>
</main>
